name: Gelato Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Run every 5 minutes
  workflow_dispatch: # Allow manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push state.json back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Monitor Script
        run: python monitor.py --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chats "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Commit and Push state.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json
          # Only commit if state.json has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update gelato status [skip ci]" && git push)
